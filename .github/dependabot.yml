# Dependabot opens pull requests when newer versions of JAP-T's dependencies
# are released. The Tests workflow runs on each one; merge only green ones.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Python packages pinned in requirements.txt.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    # One pull request for all package updates each month, instead of one per package.
    groups:
      python-packages:
        patterns:
          - "*"

  # Actions used in .github/workflows/tests.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
