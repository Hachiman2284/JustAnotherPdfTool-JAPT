name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Weekly, so security problems found in the pinned packages show up even
  # when nothing in this repository changes.
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt flake8
    - name: Lint (syntax errors and undefined names only)
      run: python -m flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Setup check
      run: python src/pdfsuite.py check
    - name: Test
      run: python -m pytest tests

  audit:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - name: Check the pinned packages for known security problems
      run: |
        python -m pip install pip-audit==2.10.1
        python -m pip_audit -r requirements.txt --no-deps --disable-pip --progress-spinner off
