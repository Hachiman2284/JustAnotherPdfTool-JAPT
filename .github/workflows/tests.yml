name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt flake8
    - name: Lint (syntax errors and undefined names only)
      run: python -m flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Setup check
      run: python src/pdfsuite.py check
    - name: Test
      run: python -m pytest tests
